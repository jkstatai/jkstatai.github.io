---
layout: default
---

{{ content }}

<div class="row g-5 mb-5">
  <div>
    <h3 class="fw-bold border-bottom pb-3 mb-5">Teaching Assistant</h3>

    {% for course in site.data.settings.courses %}
    <div class="row mb-3">

      <div class="col-md-3">
        ({{ course.semester }})
      </div>

      <div class="col-md-2">
        {{ course.school }}
      </div>

      <div class="col-md-2">
        {{ course.code }}
      </div>

      <div class="col-md-5">
        {% if course.url != "" %}
          <a href="{{ site.github.url }}/courses/{{ course.url }}">
            {{ course.title }}
          </a>
        {% else %}
          {{ course.title }}
        {% endif %}
      </div>

    </div>
    {% endfor %}

  </div>
</div>
