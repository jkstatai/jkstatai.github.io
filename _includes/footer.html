<footer class="pt-5 my-5 border-top">
  <div class="row">
    <div class="col-md-12 text-center social-media-icons">
      {% for item in site.data.settings.social %}
        <a href="{{ item.link }}" class="ms-3 fs-2">
          {% if item.image %}
            <img src="{{ item.image }}" style="height: 1em; width: auto; vertical-align: middle;">
          {% else %}
            <i class="fab fa-{{ item.icon }}" style="color: {{ item.color }};"></i>
          {% endif %}
        </a>
      {% endfor %}
    </div>
  </div>
  <div class="row mt-3 text-muted">
    <div class="col-md-12 text-center">
      <small>&copy; 2026 Justin Kao. All rights reserved.</small><br>
      <small>Last updated: October 2026</small>
    </div>
  </div>
</footer>
